# Builds the plugin and attaches a release zip on every `v*.*.*` tag.
#
# Zip layout — 4 files at root level, unzips directly into ~/.stash/plugins/:
#
#   binge-v0.1.0.zip
#   ├── binge.yml
#   ├── binge.entry.js
#   ├── binge-install.py
#   └── index.html
#
# To cut a release: `git tag v0.1.0 && git push --tags`.
#
# 需求：发布时自动更新 stash-plugins 仓库的 plugins/main/index.yml
# （version / date / path / sha256），让 Stash 插件源清单和 release 同步。
# 流程：
#   1. 构建 + 打包 zip
#   2. 计算 sha256 + 北京时间戳 + 下载 URL
#   3. clone stash-plugins 仓库 → 同一 commit 更新 index.yml + README 版本表 → commit + push
#      （单次 push 只触发一次 Pages 部署；stash-plugins 侧 sync-readme.yml 保留作兜底，
#        README 已同步时其幂等检查不会再产生 commit）
#   4. 创建 GitHub Release（上传 zip）
# index.yml 已从本仓库迁移到 k6cc/stash-plugins 仓库（commit 4ba6950），
# 需要 STASH_PLUGINS_TOKEN secret（PAT with repo scope）才能跨仓库 push。
# 如果 secret 未设置，跳过 index.yml 更新，仅创建 release。
name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.4.2, without leading "v")'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # rolldown (vite 8's bundler) ships platform-specific native
      # bindings as optionalDependencies. npm has a known bug
      # (npm/cli#4828): a lockfile generated on Windows won't install
      # Linux bindings on CI, even with `npm install`. Workaround:
      # delete the lockfile so npm resolves all platform deps fresh.
      - run: rm -f package-lock.json && npm install --no-audit --no-fund

      - name: Type check (tsc)
        run: npx tsc -b

      - name: Bundle (vite)
        run: npx vite build

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage plugin files
        run: |
          mkdir -p release
          cp binge.yml dist/binge.entry.js dist/index.html dist/binge-install.py release/

      - name: Pack zip
        run: |
          cd release
          zip "../binge-v${{ steps.ver.outputs.version }}.zip" binge.yml binge.entry.js index.html binge-install.py
          cd ..
          ls -lh "binge-v${{ steps.ver.outputs.version }}.zip"

      # 计算 zip 的 sha256 + 北京时间戳 + 下载 URL。这些值会同时用于
      # index.yml 更新和 release 说明，保证两边一致。
      - name: Compute release metadata
        id: meta
        run: |
          ZIP="binge-v${{ steps.ver.outputs.version }}.zip"
          SHA=$(sha256sum "$ZIP" | awk '{print $1}')
          TS=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          PATH_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.ver.outputs.tag }}/${ZIP}"
          {
            echo "sha=$SHA"
            echo "ts=$TS"
            echo "path_url=$PATH_URL"
          } >> "$GITHUB_OUTPUT"
          echo "=== Release metadata ==="
          echo "version : ${{ steps.ver.outputs.version }}"
          echo "tag     : ${{ steps.ver.outputs.tag }}"
          echo "date    : $TS (Asia/Shanghai)"
          echo "sha256  : $SHA"
          echo "path    : $PATH_URL"

      # 更新 k6cc/stash-plugins 仓库的 plugins/main/index.yml 与 README 版本表。
      # index.yml 已从本仓库迁移到 stash-plugins（commit 4ba6950），
      # 需要 STASH_PLUGINS_TOKEN secret（PAT with repo scope）跨仓库 push。
      # secret 未设置时跳过，仅创建 release。
      - name: Update stash-plugins index.yml and README
        env:
          PLUGIN_ID: binge
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          DATE: ${{ steps.meta.outputs.ts }}
          PATH_URL: ${{ steps.meta.outputs.path_url }}
          SHA: ${{ steps.meta.outputs.sha }}
          STASH_PLUGINS_TOKEN: ${{ secrets.STASH_PLUGINS_TOKEN }}
        run: |
          if [ -z "$STASH_PLUGINS_TOKEN" ]; then
            echo "⚠ STASH_PLUGINS_TOKEN secret not set — skipping index.yml update"
            echo "  Manual update needed: clone k6cc/stash-plugins, update plugins/main/index.yml"
            exit 0
          fi
          git clone https://x-access-token:${STASH_PLUGINS_TOKEN}@github.com/k6cc/stash-plugins.git /tmp/stash-plugins
          cd /tmp/stash-plugins
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 竞争安全：多个 release 并发推送时 push 可能被拒（non-fast-forward），
          # 每次重试前 fetch + reset 到远程最新（已包含其他插件刚推的改动），
          # 再重新套用本插件的 index.yml 更新与 README 同步。
          # index.yml 与 README 版本表放同一个 commit：一次 push 只触发一次 Pages 部署
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            # awk 只更新匹配 PLUGIN_ID 的条目，避免误改其他插件
            awk -v id="$PLUGIN_ID" -v version="$VERSION" -v date="$DATE" -v path="$PATH_URL" -v sha="$SHA" '
            /^- id: / { in_block = ($3 == id) }
            in_block && /^  version: / { print "  version: " version; next }
            in_block && /^  date: / { print "  date: " date; next }
            in_block && /^  path: / { print "  path: " path; next }
            in_block && /^  sha256: / { print "  sha256: " sha; next }
            { print }
            ' plugins/main/index.yml > /tmp/index.yml && mv /tmp/index.yml plugins/main/index.yml
            # 从 index.yml 同步 README 版本表（复用仓库自带脚本，幂等）；
            # 失败不阻塞 index.yml 提交，README 由 stash-plugins 的 sync-readme.yml 兜底
            python3 scripts/sync_readme.py || echo "⚠ sync_readme.py failed — README left to fallback workflow"
            git add plugins/main/index.yml README.md
            if git diff --cached --quiet; then
              echo "index.yml and README.md already up to date — nothing to commit"
              exit 0
            fi
            git commit -m "chore: bump ${PLUGIN_ID} to ${TAG}"
            if git push; then
              echo "=== Pushed index.yml + README update (attempt ${attempt}) ==="
              cat plugins/main/index.yml
              exit 0
            fi
            echo "⚠ push failed (attempt ${attempt}) — concurrent release detected, retrying"
            sleep $((attempt * 5))
          done
          echo "✗ failed to push index.yml after 5 attempts"
          exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: binge-v${{ steps.ver.outputs.version }}.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
