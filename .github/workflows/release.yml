# Builds the plugin and attaches a release zip on every `v*.*.*` tag.
#
# Zip layout — unzips directly into ~/.stash/plugins/:
#
#   binge-v0.1.0.zip
#   └── binge/
#       ├── binge.yml
#       ├── binge.entry.js
#       ├── index.html
#       └── binge-install.py   (binge.yml execs this by path)
#
# To cut a release: `git tag v0.1.0 && git push --tags`.
name: release

on:
    push:
        tags:
            - "v*.*.*"

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            # The publish gate.
            #
            # ci.yml runs these on push to main too, but it is a
            # SEPARATE workflow: it starts at the same moment as this
            # one and cannot stop it. A merge with failing tests
            # therefore went out to every user of the plugin browser
            # while the red X was still being drawn on the commit.
            # Running them here costs ~90s and means a failure stops
            # short of touching the plugins repo.
            - run: npm run lint

            - run: npm run format:check

            - run: npm test

            - run: npm run build

            - name: Stage plugin files
              run: |
                  mkdir -p release/binge
                  # binge-install.py belongs here as much as the other
                  # three: binge.yml execs it by path, so a plugin dir
                  # without it registers the Install binge-server task
                  # and then fails with a missing file the moment
                  # anyone presses the button.
                  cp binge.yml dist/binge.entry.js dist/index.html dist/binge-install.py release/binge/
                  test -f release/binge/binge-install.py

            - name: Pack zip
              run: |
                  cd release
                  zip -r "../binge-${GITHUB_REF_NAME}.zip" binge
                  cd ..
                  ls -lh "binge-${GITHUB_REF_NAME}.zip"

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v3
              with:
                  files: binge-${{ github.ref_name }}.zip
                  generate_release_notes: true
                  fail_on_unmatched_files: true
