# Builds the plugin and attaches a release zip on every `v*.*.*` tag.
#
# Zip layout — 4 files at root level, unzips directly into ~/.stash/plugins/:
#
#   binge-v0.1.0.zip
#   ├── binge.yml
#   ├── binge.entry.js
#   └── index.html
#
# To cut a release: `git tag v0.1.0 && git push --tags`.
name: release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.4.2, without leading "v")'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage plugin files
        run: |
          mkdir -p release
          cp binge.yml dist/binge.entry.js dist/index.html release/

      - name: Pack zip
        run: |
          cd release
          zip "../binge-v${{ steps.ver.outputs.version }}.zip" binge.yml binge.entry.js index.html
          cd ..
          ls -lh "binge-v${{ steps.ver.outputs.version }}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: binge-v${{ steps.ver.outputs.version }}.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
