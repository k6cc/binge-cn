# On every push to main, build the plugin and mirror the install
# files into ordureconnoisseur/plugins/plugins/binge/. The plugins
# repo's own build_site.sh then auto-generates the install zip + index
# entry, which is what Stash's plugin browser reads.
#
# Mirrors the sync pattern used by stash-multiview and stash-refract,
# but with the extra build step — binge is a Vite SPA, so only the
# runtime files (binge.yml + dist/binge.entry.js + dist/index.html +
# dist/binge-install.py) get copied across, not the source tree.
#
# Requires the PLUGINS_REPO_TOKEN secret (same PAT used by the other
# plugin sync workflows) on this repo.
name: Sync to plugins repo

on:
    push:
        branches: [main]

jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - run: npm run build

            - name: Clone plugins repo
              run: |
                  git clone https://x-access-token:${{ secrets.PLUGINS_REPO_TOKEN }}@github.com/ordureconnoisseur/plugins.git plugins-repo

            - name: Stage plugin files
              run: |
                  rm -rf plugins-repo/plugins/binge
                  mkdir -p plugins-repo/plugins/binge
                  # Four files: manifest, the Stash-side entry shim, the
                  # SPA bundle, and the installer binge.yml execs by
                  # path. Same set npm run push deploys to a local
                  # Stash install.
                  #
                  # The installer was missing here for as long as this
                  # workflow has existed, so every published copy of the
                  # plugin registered an Install binge-server task that
                  # could only fail. Anyone who pressed it was told the
                  # daemon did not answer on port 7878, which sounds
                  # like a daemon problem and is not one.
                  cp binge.yml plugins-repo/plugins/binge/
                  cp dist/binge.entry.js plugins-repo/plugins/binge/
                  cp dist/index.html plugins-repo/plugins/binge/
                  cp dist/binge-install.py plugins-repo/plugins/binge/
                  test -f plugins-repo/plugins/binge/binge-install.py

            - name: Commit and push
              run: |
                  cd plugins-repo
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add plugins/binge/
                  git diff --cached --quiet && echo "No changes" && exit 0
                  git commit -m "sync: binge $(git -C .. rev-parse --short HEAD)"
                  git push
